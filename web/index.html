<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>

</header>

<main>
    <div class="column">
        <h1>Proof of concept</h1>

        <div>
            <h2>Upload</h2>
            <input type="file" id="file-upload" accept="audio/*">
        </div>

        <div>
            <h2>Settings</h2>
            <div class="row label-on-bottom">
                <label>
                    <input type="range" min="0" max="1" step="0.05" value="0" id="gain-slider-input">
                    Gain
                </label>
                <label>
                    <input type="range" min="0" max="1" step="0.05" value="0" id="low-slider-input">
                    Low
                </label>
                <label>
                    <input type="range" min="0" max="1" step="0.05" value="0" id="mid-slider-input">
                    Mid
                </label>
                <label>
                    <input type="range" min="0" max="1" step="0.05" value="0" id="treble-slider-input">
                    Treble
                </label>
            </div>
        </div>

        <div class="row">
            <input type="button" id="upload-button" disabled value="Submit">
            <input type="button" id="reset-button" value="Reset">
        </div>

        <div>
            <h2>Original</h2>
            <audio controls id="original-audio-player"></audio>
        </div>

        <div>
            <h2>Ground Truth</h2>
            <audio controls id="ground-truth-audio-player"></audio>
        </div>

        <div class="column">
            <h2>Prediction</h2>
            <div class="row readonly label-on-bottom">
                <label>
                    <input type="range" min="0" max="1" step="0.05" value="0" id="gain-slider-output">
                    Gain
                </label>
                <label>
                    <input type="range" min="0" max="1" step="0.05" value="0" id="low-slider-output">
                    Low
                </label>
                <label>
                    <input type="range" min="0" max="1" step="0.05" value="0" id="mid-slider-output">
                    Mid
                </label>
                <label>
                    <input type="range" min="0" max="1" step="0.05" value="0" id="treble-slider-output">
                    Treble
                </label>
            </div>
            <audio controls id="prediction-audio-player"></audio>
            <label>
                <input type="button" value="Reset" id="prediction-reset-button">
            </label>
        </div>
    </div>
</main>

<script src="script.js"></script>
</body>
</html>
