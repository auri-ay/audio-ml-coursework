[project]
name = "audio-ml-groupwork"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "librosa>=1.0.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "requests>=2.28.1",
    "scikit-learn>=1.9.1",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "tqdm>=4.66.5",
]

[tool.uv.sources]
torch = {index = "pytorch"}
torchvision = {index = "pytorch"}


[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
